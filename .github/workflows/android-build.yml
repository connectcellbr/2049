name: Build Acerte & Ganhe APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AcerteEGanhe-AndroidStudio.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android
        run: unzip -q AcerteEGanhe-AndroidStudio.zip

      - name: Compilar APK
        working-directory: AndroidAcerteGanhe
        run: gradle assembleDebug

      - name: Disponibilizar APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: AcerteEGanhe-APK
          path: AndroidAcerteGanhe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
